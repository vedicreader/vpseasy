[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vpseasy"
dynamic = ["version"]
description = "create resources, deploy code in prod and dev. supports Hetzner, Lightsail and Multipass"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "dockeasy>=0.0.3",
    "fastcloudinit>=0.0.5",
    "fastcore>=1.12.31",
    "hcloud>=2.17.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Repository = "https://github.com/vedicreader/vpseasy"
Documentation = "https://vedicreader.github.io/vpseasy/"

[project.entry-points.nbdev]
vpseasy = "vpseasy._modidx:d"

[project.optional-dependencies]
aws = [
    "boto3>=1.40",
]
dev = [
    "boto3>=1.40",
]

[tool.hatch.version]
path = "vpseasy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["vpseasy"]

[tool.nbdev]
tst_flags = "multipass"  # cells that need a local Multipass install; run with nbdev-test --flags multipass

[tool.hatch.build.targets.sdist]
include = [
    "/vpseasy",
    "/README.md",
    "/pyproject.toml",
]
[dependency-groups]
dev = [
    "boto3>=1.43.112",
    "koshas>=0.0.9",
    "nbdev>=3.3.25",
    "notebook>=7.5.5",
]
